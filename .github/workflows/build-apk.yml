
name: Generar APK Terra Vida

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip -q TerraVida_GitHub.zip.zip -d /tmp/terravida-src
          ls -la /tmp/terravida-src
          
      - name: Generar APK
        run: |
          cd /tmp/terravida-src/TerraVida
          gradle assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Vida-APK
          path: /tmp/terravida-src/TerraVida/app/build/outputs/apk/debug/app-debug.apk
          
