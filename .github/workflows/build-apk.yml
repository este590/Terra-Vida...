
name: Generar APK Terra Vida

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar proyecto Android
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE" -name settings.gradle -type f -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Generar APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Vida-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
